name: nacagencycrm-local

services:
  db:
    image: postgres:17-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: nacagencycrm-backend:1.0.0
    pull_policy: never
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn CRM.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      JWT_ACCESS_MINUTES: "15"
      JWT_REFRESH_DAYS: "1"

      CRM_SMTP_PASSWORD: ""
      CRM_SMTP_ENCRYPTION_KEY: ${CRM_SMTP_ENCRYPTION_KEY}
      CRM_SMTP_ALLOWED_HOSTS: >-
        smtp.gmail.com,
        smtp.office365.com,
        smtp.mail.yahoo.com

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: nacagencycrm-frontend:1.0.0
    pull_policy: never
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data: